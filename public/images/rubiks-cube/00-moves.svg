<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">只记一个口诀：上 → 去 → 下 → 回</title><desc id="desc">左右方向按面对魔方时看到的顶层前沿判断；每次转 90°。</desc><rect width="800" height="400" rx="20" fill="#f8fafc"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="400" y="43" text-anchor="middle" font-size="27" fill="#172033">只记一个口诀：上 → 去 → 下 → 回</text><text x="112" y="123" text-anchor="middle" font-size="21" fill="#172033">右手</text><rect x="222" y="80" width="116" height="94" rx="12" fill="#e2e8f0"/><text x="280" y="118" text-anchor="middle" font-size="30" fill="#172033">上</text><text x="280" y="152" text-anchor="middle" font-size="17" fill="#172033">右层向上</text><rect x="362" y="80" width="116" height="94" rx="12" fill="#e2e8f0"/><text x="420" y="118" text-anchor="middle" font-size="30" fill="#172033">去</text><text x="420" y="152" text-anchor="middle" font-size="17" fill="#172033">顶层向左</text><rect x="502" y="80" width="116" height="94" rx="12" fill="#e2e8f0"/><text x="560" y="118" text-anchor="middle" font-size="30" fill="#172033">下</text><text x="560" y="152" text-anchor="middle" font-size="17" fill="#172033">右层向下</text><rect x="642" y="80" width="116" height="94" rx="12" fill="#e2e8f0"/><text x="700" y="118" text-anchor="middle" font-size="30" fill="#172033">回</text><text x="700" y="152" text-anchor="middle" font-size="17" fill="#172033">顶层向右</text><text x="112" y="251" text-anchor="middle" font-size="21" fill="#172033">左手</text><rect x="222" y="208" width="116" height="94" rx="12" fill="#e2e8f0"/><text x="280" y="246" text-anchor="middle" font-size="30" fill="#172033">上</text><text x="280" y="280" text-anchor="middle" font-size="17" fill="#172033">左层向上</text><rect x="362" y="208" width="116" height="94" rx="12" fill="#e2e8f0"/><text x="420" y="246" text-anchor="middle" font-size="30" fill="#172033">去</text><text x="420" y="280" text-anchor="middle" font-size="17" fill="#172033">顶层向右</text><rect x="502" y="208" width="116" height="94" rx="12" fill="#e2e8f0"/><text x="560" y="246" text-anchor="middle" font-size="30" fill="#172033">下</text><text x="560" y="280" text-anchor="middle" font-size="17" fill="#172033">左层向下</text><rect x="642" y="208" width="116" height="94" rx="12" fill="#e2e8f0"/><text x="700" y="246" text-anchor="middle" font-size="30" fill="#172033">回</text><text x="700" y="280" text-anchor="middle" font-size="17" fill="#172033">顶层向左</text><text x="400" y="366" text-anchor="middle" font-size="19" fill="#172033">左右方向按面对魔方时看到的顶层前沿判断；每次转 90°。</text></g></svg>